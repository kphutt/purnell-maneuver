name: CI

# Runs the same commands as the local hooks in .pre-commit-config.yaml, so a pull request
# from a clone without those hooks still gets checked. Keep the two lists the same.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly, so a newly published advisory for a locked dependency shows up on a quiet main.
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # This name is the required status check on main. Rename both together.
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Install cargo-deny and gitleaks
        run: |
          curl -sSLO https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz" | sha256sum -c -
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz --strip-components=1 -C "$RUNNER_TEMP/bin" cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          rm cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz gitleaks_8.30.1_linux_x64.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo deny --locked check
      - run: gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts=--all
      - run: cargo test --locked
      - run: cargo build -p token -p seal -p gate --target wasm32v1-none --locked
      - run: cargo build -p token -p seal -p gate --target wasm32-unknown-unknown --locked
      - run: cargo build -p token -p seal -p gate --target wasm32-wasip1 --locked

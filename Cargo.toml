[workspace]
resolver = "2"
members = ["crates/token", "crates/seal", "crates/gate"]

[workspace.package]
edition = "2021"
publish = false

# Shared with every workspace member via `[lints] workspace = true` in each crate's
# Cargo.toml, so the "no unsafe, no panics" rules live in one place. The checks run
# `cargo clippy --all-targets`, so test code is linted too; clippy.toml exempts
# `#[test]` code from the panic lints, and each integration test file allows them at its
# top, so these deny levels bite outside tests only, as the rules require.
[workspace.lints.rust]
unsafe_code = "forbid"
# `token`'s Kani proof harnesses (crates/token/src/canonical_kani.rs) live behind
# `#[cfg(kani)]`, a cfg only Kani's own compiler driver sets — never `cargo build`,
# `cargo test` or `cargo clippy`. Without this, `-D warnings` turns that cfg into a
# hard error under `--all-targets`, since rustc does not otherwise know `kani` is a
# real, if never-locally-set, cfg name.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
# No arithmetic that can overflow (or divide by zero) in the core: use checked_*
# (or a form that cannot overflow) instead. Test code allows it at the top of each
# test module and integration test file, since a test fails by panicking anyway.
arithmetic_side_effects = "deny"

# Local checks for purnell-maneuver. These run on the developer's machine before
# anything is pushed. Fast checks run on every commit; the slower ones (full test suite,
# the three wasm builds) run on push instead, so commits stay fast.
#
# Install once per clone: `pre-commit install --hook-type pre-commit --hook-type pre-push`

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-clippy
        name: cargo clippy -- -D warnings
        entry: cargo clippy -- -D warnings
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --staged --no-banner --config .gitleaks.toml
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: cargo-test
        name: cargo test (incl. shared testdata/vectors cases)
        entry: cargo test
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: wasm-build-wasm32v1-none
        name: cargo build -p seal -p gate --target wasm32v1-none
        entry: cargo build -p seal -p gate --target wasm32v1-none
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: wasm-build-wasm32-unknown-unknown
        name: cargo build -p seal -p gate --target wasm32-unknown-unknown
        entry: cargo build -p seal -p gate --target wasm32-unknown-unknown
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: wasm-build-wasm32-wasip1
        name: cargo build -p seal -p gate --target wasm32-wasip1
        entry: cargo build -p seal -p gate --target wasm32-wasip1
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
